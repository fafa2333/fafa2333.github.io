<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Architectural Line Studies — BIT / NTU</title>
  </head>
  <body>
    <main class="dual-preview" aria-label="Architectural line model comparison">
      <figure class="model-study" data-model="bit">
        <div class="model-viewport"><canvas tabindex="0" aria-label="BIT Central Teaching Building. Drag horizontally to rotate; left and right arrow keys also rotate."></canvas><p class="model-error" role="status" hidden></p></div>
        <figcaption>BIT Central Teaching Building</figcaption>
      </figure>
      <figure class="model-study" data-model="hive">
        <div class="model-viewport"><canvas tabindex="0" aria-label="NTU The Hive. Drag horizontally to rotate; left and right arrow keys also rotate."></canvas><p class="model-error" role="status" hidden></p></div>
        <figcaption>NTU The Hive</figcaption>
      </figure>
    </main>
    <script type="module" src="/src/wireframe-dual-preview/main.js"></script>
  </body>
</html>
