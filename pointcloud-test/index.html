<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>BIT 点云实验</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <main class="experiment">
    <div class="pointcloud-viewer">
      <canvas id="pointcloud-canvas" tabindex="0" aria-label="北京理工大学中心教学楼点云，按住鼠标左键拖动旋转；方向键也可旋转"></canvas>
      <p id="load-status" role="status">正在读取点云…</p>
    </div>
    <button id="scan-toggle" type="button" disabled aria-controls="pointcloud-canvas">散开</button>
  </main>
  <noscript>请启用 JavaScript 查看点云实验。</noscript>
  <script id="pointcloud-diagnostics" type="application/json">{}</script>
  <script type="module" src="/src/pointcloud-test/main.js"></script>
</body>
</html>
